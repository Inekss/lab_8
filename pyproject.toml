[project]
name = "findex"
version = "1.0.0"
description = "Search engine with NumPy scorers, hybrid semantic search, FastAPI UI"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "selectolax>=0.3",
    "psutil>=5.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "numpy>=2.0",
]

[project.scripts]
findex = "findex.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "matplotlib>=3.8",
    "py-spy>=0.4.2",
    "flameprof>=0.4",
]
# Heavy (torch). Install only when embedding: uv sync --group semantic
semantic = [
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[tool.hatch.build.targets.wheel.force-include]
"src/findex/web/templates" = "findex/web/templates"
"src/findex/web/static" = "findex/web/static"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--benchmark-min-rounds=3 --benchmark-warmup=on"
